[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
; root CAs for verifying HTTPS blocklist downloads (regenerate: tools/gen_crt_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3]
; the generic S3 board def assumes 8MB flash; 4MB modules (e.g. ESP32-S3FH4R2) boot-loop without this
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; without BOARD_HAS_PSRAM the Arduino core #undefs CONFIG_SPIRAM and never initialises PSRAM,
; even on modules that have it (S3 super mini / ESP32-S3FH4R2: 2 MB). Harmless on S3 boards
; without PSRAM: init fails with a warning and the answer cache stays in internal RAM.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
